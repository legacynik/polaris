# .fix/contract.yml — THIS repository's ceremony.
#
# The gate holds no commands, hosts or paths: it reads them from here. That is what makes the
# same skill usable on repositories with different stacks. Keys stay as they are (the gate reads
# them by name); only these comments are prose.
#
# Rule: a value you do not know is NOT invented. Leave it empty with a comment saying what is
# missing — the gate will fail on that stage, and that is correct: an invented contract is worse
# than an incomplete one.

# Controlled vocabulary of `dominio`. Per repository, from the product glossary.
# It is the aggregation key: without it records cannot be counted and the cross-repo query
# ("how many times did X break") does not exist.
dominii: []

test:
  # How the suite runs. Used by stage `verde`.
  suite: ""
  # One module. The gate substitutes {modulo}.
  modulo: ""

ci:
  # The command CI uses to COLLECT tests (e.g. `pytest --collect-only -q <subset>`, the same
  # subset the workflow runs). Used by stage `raccolto`: a test committed but absent from this
  # output is an ORPHAN — CI will never run it (R5).
  collect: ""

# This repository's PROD perimeter: the paths (globs) whose code gets deployed.
# Read by sweep_gate.py: a PR OUTSIDE these paths self-merges with approve + a fresh SHA only;
# INSIDE it needs risk:trivial + a runtime attestation.
# Undeclared = the narrow path for everything: the gate does not guess what prod is.
deployabili: []

staging:
  # How to get there. Used by stage `realtest` (holistic real test).
  deploy: ""
  # How to read what happened.
  logs: ""
  # The smoke test, if one exists.
  smoke: ""
  url: ""

prod:
  deploy: ""
  # MUST have an exit code: used by stage `prod` (prod-verified).
  # "I deployed" is not proof; this command is.
  osserva: ""

# Path of the tdd-dev skill, for stage `rosso` (test-first cycle with a recorded RED).
# `~` expands: with `npx skills add ... -g` the skills live in ~/.agents/skills/.
tdd_dev: "~/.agents/skills/tdd-dev"
# Path of the real-testing skill, for stage `realtest`.
real_test: "~/.agents/skills/real-testing"
