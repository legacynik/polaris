name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pytest pyyaml
      - name: Git identity for the throwaway repos the tests build
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: python -m pytest polaris/tests -q
      - name: Every shipped script that has a selfcheck passes it
        run: |
          fail=0
          for f in polaris/skills/*/scripts/*.py; do
            grep -q -- --selfcheck "$f" || continue
            python "$f" --selfcheck >/dev/null || { echo "FAIL $f"; fail=1; }
          done
          exit $fail
      - run: bash polaris/scripts/check_skills.sh
      - name: Every touched skill moved its version
        if: github.event_name == 'pull_request'
        run: python polaris/scripts/check_skill_versions.py "origin/${{ github.base_ref }}"
